---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-trigger-jenkins-job-empty-param
  annotations:
    test/assert-task-failure: "run-trigger-jenkins-job"
spec:
  description: |
    Negative test: trigger-jenkins-job task fails at Python-level validation
    when JOB_NAME is empty. This exercises the input validation code path
    inside the script rather than failing at pod scheduling.
  tasks:
    - name: run-trigger-jenkins-job
      taskRef:
        name: trigger-jenkins-job
      params:
        - name: JENKINS_HOST_URL
          value: "https://mock-jenkins.$(context.pipelineRun.namespace).svc.cluster.local:8443"
        - name: JOB_NAME
          value: ""
