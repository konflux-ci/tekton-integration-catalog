apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: test-kind-ibm-provision-pass
spec:
  description: >-
    Provisions a Kind cluster with the cxf-24x48 Flex profile, then destroys
    it in a finally task. Requires the IBM and OCI test credentials in the
    test namespace.
  tasks:
    - name: provision
      taskRef:
        name: kind-ibm-provision
      params:
        - {name: secret-ibmcloud-credentials, value: ibmcloud-mapt-credentials}
        - {name: id, value: $(context.pipelineRun.uid)}
        - {name: catalog-revision, value: main}
        - {name: catalog-url, value: https://github.com/konflux-ci/tekton-integration-catalog.git}
        - {name: cluster-access-secret-name, value: $(context.pipelineRun.uid)}
        - {name: ssh-credentials-secret-name, value: $(context.pipelineRun.uid)-ssh-creds}
        - {name: ownerKind, value: PipelineRun}
        - {name: ownerName, value: $(context.pipelineRun.name)}
        - {name: ownerUid, value: $(context.pipelineRun.uid)}
        - {name: backed-url, value: s3://konflux-mapt-state/mapt/kind/test/$(context.pipelineRun.uid)}
        - {name: compute-sizes, value: cxf-24x48}
        - {name: oci-ref, value: quay.io/konflux-test-storage/konflux-team/tekton-integration-catalog:$(context.pipelineRun.name)}
  finally:
    - name: deprovision
      taskRef:
        resolver: git
        params:
          - {name: url, value: https://github.com/konflux-ci/tekton-integration-catalog.git}
          - {name: revision, value: main}
          - {name: pathInRepo, value: tasks/mapt-oci/kind-ibm-deprovision/0.1/kind-ibm-deprovision.yaml}
      params:
        - {name: secret-ibmcloud-credentials, value: ibmcloud-mapt-credentials}
        - {name: id, value: $(context.pipelineRun.uid)}
        - {name: backed-url, value: s3://konflux-mapt-state/mapt/kind/test/$(context.pipelineRun.uid)}
        - {name: cluster-access-secret, value: $(tasks.provision.results.cluster-access-secret)}
        - {name: oci-container, value: quay.io/konflux-test-storage/konflux-team/tekton-integration-catalog:$(context.pipelineRun.name)}
