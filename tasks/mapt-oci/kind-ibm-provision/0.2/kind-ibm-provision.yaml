---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kind-ibm-provision
  labels:
    app.kubernetes.io/version: "0.2"
    upstream-usable: "true"
  annotations:
    tekton.dev/pipelines.minVersion: "0.44.x"
    tekton.dev/categories: infrastructure
    tekton.dev/tags: infrastructure, ibm, kind
    tekton.dev/displayName: Kind Cloud Single Node - Create
    tekton.dev/platforms: "linux/amd64, linux/arm64"
    mapt/version: "0.14.5"
spec:
  description: Creates a configurable Kind cluster on IBM Cloud using mapt.
  volumes:
    - name: ibm-credentials
      secret:
        secretName: $(params.secret-ibmcloud-credentials)
    - name: cluster-info
      emptyDir: {}
    - name: logs
      emptyDir: {}
    - name: konflux-test-infra-volume
      secret:
        secretName: $(params.oci-credentials)
  params:
    - name: secret-ibmcloud-credentials
      type: string
      description: Secret containing IBMCLOUD_API_KEY and COS HMAC credentials.
    - name: id
      type: string
      description: A unique identifier for this Kind environment.
    - name: catalog-revision
      type: string
      default: main
      description: Git revision from which nested StepActions are resolved.
    - name: catalog-url
      type: string
      default: https://github.com/konflux-ci/tekton-integration-catalog.git
      description: Git repository URL from which nested StepActions are resolved.
    - name: cluster-access-secret-name
      type: string
      default: $(context.pipelineRun.name)
      description: Name of the Secret that stores the generated kubeconfig.
    - name: ssh-credentials-secret-name
      type: string
      default: ""
      description: Name of the Secret that stores generated SSH credentials.
    - name: ownerKind
      type: string
      default: PipelineRun
      description: Kind of the owner resource for generated Secrets.
    - name: ownerName
      type: string
      description: Name of the owner resource for generated Secrets.
    - name: ownerUid
      type: string
      description: UID of the owner resource for generated Secrets.
    - name: region
      type: string
      default: us-south
      description: IBM Cloud region in which to provision the instance.
    - name: zone
      type: string
      default: us-south-2
      description: IBM Cloud zone in which to provision the instance.
    - name: version
      type: string
      default: v1.34
      description: Kubernetes version for the Kind cluster.
    - name: compute-sizes
      type: string
      default: cxf-24x48
      description: >-
        mapt instance profile to use. Defaults to the IBM Flex profile cxf-24x48.
        When set, this takes precedence over cpus and memory. Set to an empty
        string to select a profile from cpus and memory.
    - name: cpus
      type: string
      default: "32"
      description: Number of vCPUs to allocate.
    - name: memory
      type: string
      default: "64"
      description: Amount of memory in GiB to allocate.
    - name: backed-url
      type: string
      description: Shared s3:// IBM COS backend used by provision and destroy.
    - name: tags
      type: string
      default: ""
      description: IBM Cloud resource tags; standard mapt tags are added automatically.
    - name: extra-port-mappings
      type: string
      default: '[{"containerPort":30012,"hostPort":8180,"protocol":"TCP"}]'
      description: Additional Kind port mappings as a JSON array of objects.
    - name: harden-control-plane
      type: string
      default: "false"
      description: Harden the Kind control plane after provisioning.
    - name: debug
      type: string
      default: "false"
      description: Enables verbose logging.
    - name: timeout
      type: string
      default: ""
      description: Auto-destroy timeout.
    - name: oci-ref
      type: string
      description: OCI image reference to which diagnostic logs are pushed.
    - name: oci-credentials
      type: string
      default: konflux-test-infra
      description: Name of the Secret containing OCI registry credentials.
  results:
    - name: cluster-access-secret
      description: Secret containing the generated kubeconfig, if available.
      value: $(steps.create-kubeconfig-secret.results.secret-name)
    - name: ssh-credentials-secret
      description: Secret containing generated SSH credentials, if available.
      value: $(steps.create-ssh-credentials-secret.results.secret-name)
  stepTemplate:
    env:
      - name: LOG_FILENAME
        value: /var/log-dir/kind-ibm-provision.log
    volumeMounts:
      - name: logs
        mountPath: /var/log-dir
  steps:
    - name: create-kubeconfig-secret
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/create-kubeconfig-secret/0.1/create-kubeconfig-secret.yaml}]
      params:
        - {name: secret-name, value: $(params.cluster-access-secret-name)}
        - {name: namespace, value: $(context.taskRun.namespace)}
        - {name: ownerKind, value: $(params.ownerKind)}
        - {name: ownerName, value: $(params.ownerName)}
        - {name: ownerUid, value: $(params.ownerUid)}
    - name: create-ssh-credentials-secret
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/create-ssh-credentials-secret/0.1/create-ssh-credentials-secret.yaml}]
      params:
        - {name: secret-name, value: $(params.ssh-credentials-secret-name)}
        - {name: namespace, value: $(context.taskRun.namespace)}
        - {name: ownerKind, value: $(params.ownerKind)}
        - {name: ownerName, value: $(params.ownerName)}
        - {name: ownerUid, value: $(params.ownerUid)}
    - name: provisioner
      onError: continue
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/kind-ibm-provisioner/0.2/kind-ibm-provisioner.yaml}]
      params:
        - {name: ibm-credentials-volume, value: ibm-credentials}
        - {name: cluster-info-volume, value: cluster-info}
        - {name: id, value: $(params.id)}
        - {name: region, value: $(params.region)}
        - {name: zone, value: $(params.zone)}
        - {name: version, value: $(params.version)}
        - {name: compute-sizes, value: $(params.compute-sizes)}
        - {name: cpus, value: $(params.cpus)}
        - {name: memory, value: $(params.memory)}
        - {name: backed-url, value: $(params.backed-url)}
        - {name: tags, value: $(params.tags)}
        - {name: extra-port-mappings, value: $(params.extra-port-mappings)}
        - {name: debug, value: $(params.debug)}
        - {name: timeout, value: $(params.timeout)}
    - name: protect-control-plane
      onError: continue
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/protect-control-plane/0.1/protect-control-plane.yaml}]
      params:
        - {name: harden-control-plane, value: $(params.harden-control-plane)}
        - {name: kubeconfig-dir, value: /opt/cluster-info}
        - {name: kubeconfig-volume-name, value: cluster-info}
    - name: update-kubeconfig-secret
      onError: continue
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/update-kubeconfig-secret/0.1/update-kubeconfig-secret.yaml}]
      params:
        - {name: secret-name, value: $(params.cluster-access-secret-name)}
        - {name: namespace, value: $(context.taskRun.namespace)}
        - {name: cluster-info-volume, value: cluster-info}
    - name: update-ssh-credentials-secret
      onError: continue
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/update-ssh-credentials-secret/0.1/update-ssh-credentials-secret.yaml}]
      params:
        - {name: secret-name, value: $(params.ssh-credentials-secret-name)}
        - {name: namespace, value: $(context.taskRun.namespace)}
        - {name: cluster-info-volume, value: cluster-info}
    - name: secure-push-oci
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml}]
      params:
        - {name: workdir-path, value: /var/log-dir}
        - {name: oci-ref, value: $(params.oci-ref)}
        - {name: credentials-volume-name, value: konflux-test-infra-volume}
    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params: [{name: url, value: $(params.catalog-url)}, {name: revision, value: $(params.catalog-revision)}, {name: pathInRepo, value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml}]
