---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fedora-vm-provision
  labels:
    app.kubernetes.io/version: "0.2"
    upstream-usable: "true"
  annotations:
    tekton.dev/pipelines.minVersion: "0.44.x"
    tekton.dev/categories: infrastructure
    tekton.dev/tags: infrastructure, aws, fedora
    tekton.dev/displayName: "Create Fedora VM"
    tekton.dev/platforms: "linux/amd64, linux/arm64"
    mapt/version: "v1.0.0-dev"
spec:
  description: |
    Creates a fedora virtual machine on AWS, powered by the Mapt CLI.
    This task is ideal for creating fedora VM for testing in CI/CD workflows.

    It supports:
      - Spot instance provisioning
      - Custom CPU, memory, and architecture configurations
      - Automatic virtual machine removal via timeout
      - Securely exposes the credentials as a Kubernetes Secret
      - Adds the SSH host public key of the machine to that Secret, so consuming
        tasks can populate `known_hosts` instead of disabling host key checking

  volumes:
    - name: aws-credentials
      secret:
        secretName: $(params.secret-aws-credentials)
    - name: host-info
      emptyDir: {}

  params:
    # input credentials
    - name: secret-aws-credentials
      description: |
        K8S secret holding the aws credentials. Secret should be accessible to this task.

        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: aws-${name}
        type: Opaque
        data:
          access-key: ${access_key}
          secret-key: ${secret_key}
          region: ${region}
          bucket: ${bucket}
    # mapt params
    - name: id
      description: identifier for the provisioned environment
    # resulting secret name
    - name: host-access-secret-name
      type: string
      default: ""
      description: |
        (Optional) Once the target is provisioned the config to connect is addded to a secret
        check resutls. If this param is set the secret will be created with the name set
        otherwise if left empty, no secret will be created.
        When set, it must be a DNS-1123 subdomain and `ownerName` / `ownerUid` must be
        set as well; any other value fails the task.
    # ownership
    - name: ownerKind
      type: string
      default: "PipelineRun"
      description: |
        (Optional) The type of resource that should own the generated Secret.
        Deletion of this resource will trigger deletion of the Secret.
        Supported values: `PipelineRun`, `TaskRun`.
    - name: ownerName
      type: string
      default: ""
      description: |
        (Optional) The name of the resource that should own the generated Secret.
        This should either be passed the value of `$(context.pipelineRun.name)`
        or `$(context.taskRun.name)` depending on the value of `ownerKind`.
        Required, and must be a DNS-1123 subdomain, when `host-access-secret-name`
        is set.
    - name: ownerUid
      type: string
      default: ""
      description: |
        (Optional) The uid of the resource that should own the generated Secret.
        This should either be passed the value of `$(context.pipelineRun.uid)`
        or `$(context.taskRun.uid)` depending on the value of `ownerKind`.
        Required when `host-access-secret-name` is set.
    # VM type params
    - name: arch
      description: Architecture for the machine. Allowed x86_64 or arm64 (default "x86_64")
      default: "x86_64"
    - name: cpus
      description: Number of CPUs for the cloud instance (default 4)
      default: "4"
    - name: memory
      description: Amount of RAM for the cloud instance in GiB (default 16)
      default: "16"
    - name: compute-families
      default: ""
      description: |
        Comma-separated allowlist of compute family prefixes (e.g. m5,m6i,m7i for AWS).
        Empty means no restriction. Only used when compute-sizes is not set.
    - name: compute-sizes
      description: |
        Comma seperated list of sizes for the machines to be requested, e.g. `m5a.large,m6a.large`
        If set this takes precedence over compute by args
      default: ""
    - name: gpu-manufacturer
      description: Manufacturer company name for GPU. (i.e. NVIDIA)
      default: ""
    - name: gpus
      description: Number of GPUs for the cloud instance (default 0)
      default: "0"
    - name: nested-virt
      description: Use cloud instance that has nested virtualization support
      default: "false"
    - name: spot
      description: Check best spot option to spin the machine and will create resources on that region.
      default: "true"
    - name: spot-eviction-tolerance
      description: |
        If spot is enabled we can define the minimum tolerance level of eviction.
        Allowed value are: lowest, low, medium, high or highest
      default: "lowest"
    - name: spot-excluded-regions
      description: Comma-separated list of zone IDs to exclude from spot selection
      default: ""
    - name: spot-increase-rate
      description: Percentage to be added on top of the current calculated spot price to increase chances to get the machine.
      default: "20"
    # fedora params
    - name: version
      description: Version of the Fedora OS to use (default 42)
      default: "42"
    # metadata params
    - name: tags
      description: Tags for the resources created on the providers
      default: ""
    # control params
    - name: debug
      description: |
        Warning setting this param to true exposes partially masked credentials

        The parameter is intended to add verbosity on the task execution and also print masked credentials
        (showing first and last character with *** in the middle) on stdout to help with debugging
      default: "false"
    - name: host-key-scan-timeout
      description: |
        Maximum time in seconds to wait for the SSH host public key of the machine to
        become available. Set to `0` to skip the host key scan entirely.
        Must be a nonnegative decimal integer of at most 9 digits; any other value
        fails the task.
      default: "120"
    # cleanup params
    - name: timeout
      description: Auto-destroy timeout. Empty means no auto-destroy.
      default: ""
  results:
    - name: host-access-secret
      description: |
        kubernetes secret holding the information to connect with the target machine.

          ---
          apiVersion: v1
          kind: Secret
          metadata:
            name: ${name}
          type: Opaque
          data:
            host: ${host}
            username: ${username}
            id_rsa: ${id_rsa}
            host-public-key: ${host_public_key}

        `host-public-key` holds the SSH host public key(s) of the machine in
        `known_hosts` format (one line per key type, as returned by `ssh-keyscan`),
        so consumers can verify the host instead of running ssh with
        `StrictHostKeyChecking=no`. It is empty when the key could not be retrieved
        within `host-key-scan-timeout` seconds.
  steps:
    - name: provisioner
      image: quay.io/redhat-developer/mapt:v0.14.5@sha256:a80035e53b855f3f54c95e7b2b000a88da95110d1e5fb65388b2d4ab8621181a
      imagePullPolicy: Always
      # Params are passed through the environment rather than interpolated into
      # the script. Tekton substitutes $(params.*) as plain text before bash
      # parses the script, so interpolating them inline would let a param value
      # containing shell metacharacters execute arbitrary commands.
      env:
        - name: HOME
          value: /opt/mapt/run
        - name: PARAM_ID
          value: $(params.id)
        - name: PARAM_ARCH
          value: $(params.arch)
        - name: PARAM_CPUS
          value: $(params.cpus)
        - name: PARAM_MEMORY
          value: $(params.memory)
        - name: PARAM_COMPUTE_FAMILIES
          value: $(params.compute-families)
        - name: PARAM_COMPUTE_SIZES
          value: $(params.compute-sizes)
        - name: PARAM_GPU_MANUFACTURER
          value: $(params.gpu-manufacturer)
        - name: PARAM_GPUS
          value: $(params.gpus)
        - name: PARAM_NESTED_VIRT
          value: $(params.nested-virt)
        - name: PARAM_SPOT
          value: $(params.spot)
        - name: PARAM_SPOT_EVICTION_TOLERANCE
          value: $(params.spot-eviction-tolerance)
        - name: PARAM_SPOT_EXCLUDED_REGIONS
          value: $(params.spot-excluded-regions)
        - name: PARAM_SPOT_INCREASE_RATE
          value: $(params.spot-increase-rate)
        - name: PARAM_VERSION
          value: $(params.version)
        - name: PARAM_TAGS
          value: $(params.tags)
        - name: PARAM_DEBUG
          value: $(params.debug)
        - name: PARAM_TIMEOUT
          value: $(params.timeout)
      volumeMounts:
        - name: aws-credentials
          mountPath: /opt/aws-credentials
        - name: host-info
          mountPath: /opt/host-info
      script: |
        #!/bin/bash

        set -euo pipefail

        # Function to mask credentials (show first and last char, hide middle)
        mask_credential() {
          local cred="$1"
          if [ "${#cred}" -le 2 ]; then
            echo "***"
          else
            echo "${cred:0:1}***${cred: -1}"
          fi
        }

        # Credentials - set these BEFORE enabling debug mode
        AWS_ACCESS_KEY_ID="$(cat /opt/aws-credentials/access-key)"
        export AWS_ACCESS_KEY_ID
        AWS_SECRET_ACCESS_KEY="$(cat /opt/aws-credentials/secret-key)"
        export AWS_SECRET_ACCESS_KEY
        AWS_DEFAULT_REGION="$(cat /opt/aws-credentials/region)"
        export AWS_DEFAULT_REGION
        BUCKET=$(cat /opt/aws-credentials/bucket)

        # If debug add verbosity and print masked credentials
        if [[ "${PARAM_DEBUG}" == "true" ]]; then
          echo "AWS_ACCESS_KEY_ID=$(mask_credential "$AWS_ACCESS_KEY_ID")"
          echo "AWS_SECRET_ACCESS_KEY=$(mask_credential "$AWS_SECRET_ACCESS_KEY")"
          echo "AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION"
          echo "BUCKET=$BUCKET"
          set -xeuo pipefail
        fi

        # Run mapt. The command is built as an array and executed directly, so
        # every param stays a single argument and is never re-parsed by the shell.
        cmd=(mapt aws fedora create
          --project-name "mapt-fedora-${PARAM_ID}"
          --backed-url "s3://${BUCKET}/mapt/fedora/${PARAM_ID}"
          --conn-details-output /opt/host-info
          --tags "${PARAM_TAGS}"
        )

        if [[ "${PARAM_DEBUG}" == "true" ]]; then
          cmd+=(--debug)
        fi

        if [[ "${PARAM_COMPUTE_SIZES}" != "" ]]; then
          cmd+=(--compute-sizes "${PARAM_COMPUTE_SIZES}")
        else
          if [[ "${PARAM_COMPUTE_FAMILIES}" != "" ]]; then
            cmd+=(--compute-families "${PARAM_COMPUTE_FAMILIES}")
          fi

          cmd+=(--cpus "${PARAM_CPUS}")
          cmd+=(--memory "${PARAM_MEMORY}")
          cmd+=(--gpus "${PARAM_GPUS}")
          cmd+=(--gpu-manufacturer "${PARAM_GPU_MANUFACTURER}")
        fi

        if [[ "${PARAM_NESTED_VIRT}" == "true" ]]; then
          cmd+=(--nested-virt)
        fi

        cmd+=(--arch "${PARAM_ARCH}")
        cmd+=(--version "${PARAM_VERSION}")

        if [[ "${PARAM_SPOT}" == "true" ]]; then
          cmd+=(--spot)
          cmd+=(--spot-increase-rate "${PARAM_SPOT_INCREASE_RATE}")
          cmd+=(--spot-eviction-tolerance "${PARAM_SPOT_EVICTION_TOLERANCE}")
          cmd+=(--spot-excluded-regions "${PARAM_SPOT_EXCLUDED_REGIONS}")
        fi

        # `''` is accepted as "unset" too: it was the 0.1 default, where the value
        # was interpolated into an eval'd string and the shell stripped the quotes.
        if [[ "${PARAM_TIMEOUT}" != "" && "${PARAM_TIMEOUT}" != "''" ]]; then
          cmd+=(--timeout "${PARAM_TIMEOUT}")
        fi

        "${cmd[@]}"

      computeResources:
        requests:
          memory: "1Gi"
          cpu: "100m"
        limits:
          memory: "2Gi"
          cpu: "300m"

    - name: scan-host-public-key
      image: quay.io/konflux-qe-incubator/konflux-qe-tools:latest
      env:
        - name: SCAN_TIMEOUT
          value: $(params.host-key-scan-timeout)
        - name: SECRET_NAME
          value: $(params.host-access-secret-name)
      volumeMounts:
        - name: host-info
          mountPath: /opt/host-info
      script: |
        #!/bin/bash

        set -euo pipefail

        HOST_KEY_PATH=/opt/host-info/host-public-key
        # Always materialize the file, even when the scan is skipped or fails,
        # so the secret creation step can read it unconditionally.
        : > "${HOST_KEY_PATH}"

        # Validate before any arithmetic evaluation: bash arithmetic contexts
        # expand nested command substitutions, so only plain decimal digits are
        # accepted here.
        if [[ ! "${SCAN_TIMEOUT}" =~ ^[0-9]{1,9}$ ]]; then
          echo "[ERROR] host-key-scan-timeout must be a nonnegative integer (max 9 digits)." >&2
          exit 1
        fi
        # Normalize, so values such as 0120 or 00 are base-10 and not octal.
        SCAN_TIMEOUT=$((10#${SCAN_TIMEOUT}))

        if (( SCAN_TIMEOUT == 0 )); then
          echo "[INFO] host-key-scan-timeout is 0, skipping the SSH host key scan."
          exit 0
        fi

        # Nothing consumes the key when no secret is created, so do not spend the scan timeout on it.
        if [[ -z "${SECRET_NAME}" ]]; then
          echo "[INFO] No host credentials secret requested, skipping the SSH host key scan."
          exit 0
        fi

        HOST="$(tr -d '\n' < /opt/host-info/host)"
        if [[ -z "${HOST}" ]]; then
          echo "[WARNING] No host address available, leaving the host-public-key empty."
          exit 0
        fi

        INTERVAL=10
        KEYSCAN_TIMEOUT=10
        # Everything is clamped against this deadline, so neither an in-flight
        # ssh-keyscan nor the sleep between attempts can overshoot SCAN_TIMEOUT.
        DEADLINE=$(( SECONDS + SCAN_TIMEOUT ))
        HOST_KEY=""
        while true; do
          REMAINING=$(( DEADLINE - SECONDS ))
          (( REMAINING > 0 )) || break
          ATTEMPT_TIMEOUT=$(( REMAINING < KEYSCAN_TIMEOUT ? REMAINING : KEYSCAN_TIMEOUT ))
          if HOST_KEY="$(ssh-keyscan -T "${ATTEMPT_TIMEOUT}" -t rsa,ecdsa,ed25519 "${HOST}" 2>/dev/null)" && [[ -n "${HOST_KEY}" ]]; then
            break
          fi
          HOST_KEY=""
          REMAINING=$(( DEADLINE - SECONDS ))
          (( REMAINING > 0 )) || break
          NEXT_INTERVAL=$(( REMAINING < INTERVAL ? REMAINING : INTERVAL ))
          echo "[INFO] SSH host key for ${HOST} is not available yet, retrying in ${NEXT_INTERVAL}s ..."
          sleep "${NEXT_INTERVAL}"
        done

        if [[ -z "${HOST_KEY}" ]]; then
          echo "[WARNING] Could not retrieve the SSH host key of ${HOST} within ${SCAN_TIMEOUT}s."
          echo "[WARNING] The host-public-key entry of the secret will be left empty."
          exit 0
        fi

        echo "[INFO] SSH host public key(s) for ${HOST}:"
        echo "${HOST_KEY}"
        printf '%s\n' "${HOST_KEY}" > "${HOST_KEY_PATH}"

      computeResources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "20m"

    - name: create-host-info-secret
      image: registry.redhat.io/openshift4/ose-cli:4.13@sha256:e70eb2be867f1236b19f5cbfeb8e0625737ce0ec1369e32a4f9f146aaaf68d49
      env:
        - name: NAMESPACE
          value: $(context.taskRun.namespace)
        - name: OWNER_KIND
          value: $(params.ownerKind)
        - name: OWNER_NAME
          value: $(params.ownerName)
        - name: OWNER_UID
          value: $(params.ownerUid)
        - name: SECRET_NAME
          value: $(params.host-access-secret-name)
      volumeMounts:
        - name: host-info
          mountPath: /opt/host-info
      workingDir: /opt/host-info
      script: |
        #!/bin/bash
        set -euo pipefail

        if [[ "${SECRET_NAME}" == "" ]]; then
          echo "[INFO] No host credentials secret requested, skipping."
          echo -n "" | tee "$(results.host-access-secret.path)"
          exit 0
        fi

        # Every value that reaches the manifest below is either passed to oc as
        # a single argv element or checked against the Kubernetes grammar here,
        # so none of them can alter the structure of the created object.
        # The secret name is validated rather than just quoted, because a value
        # starting with a dash would otherwise be consumed as an oc flag.
        if [[ ! "${SECRET_NAME}" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ || ${#SECRET_NAME} -gt 253 ]]; then
          echo "[ERROR] host-access-secret-name must be a DNS-1123 subdomain, got '${SECRET_NAME}'." >&2
          exit 1
        fi
        if [[ ! "${OWNER_KIND}" =~ ^(PipelineRun|TaskRun)$ ]]; then
          echo "[ERROR] ownerKind must be either PipelineRun or TaskRun, got '${OWNER_KIND}'." >&2
          exit 1
        fi
        if [[ ! "${OWNER_NAME}" =~ ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$ || ${#OWNER_NAME} -gt 253 ]]; then
          echo "[ERROR] ownerName must be a DNS-1123 subdomain naming the owning ${OWNER_KIND}." >&2
          echo "[ERROR] Pass \$(context.pipelineRun.name) or \$(context.taskRun.name) to it." >&2
          exit 1
        fi
        if [[ ! "${OWNER_UID}" =~ ^[a-zA-Z0-9-]{1,64}$ ]]; then
          echo "[ERROR] ownerUid must be the UID of the owning ${OWNER_KIND}." >&2
          echo "[ERROR] Pass \$(context.pipelineRun.uid) or \$(context.taskRun.uid) to it." >&2
          exit 1
        fi

        OWNER_PATCH="$(printf \
          '{"metadata":{"ownerReferences":[{"apiVersion":"tekton.dev/v1","kind":"%s","name":"%s","uid":"%s"}]}}' \
          "${OWNER_KIND}" "${OWNER_NAME}" "${OWNER_UID}")"

        # `oc create secret generic` encodes the names and the payload itself,
        # so nothing read from the provisioner output or from a param is ever
        # parsed as YAML. The owner reference is merged client-side (--local)
        # so the Secret still reaches the cluster in a single create, and never
        # exists unowned.
        oc create secret generic "${SECRET_NAME}" \
          --namespace "${NAMESPACE}" \
          --type=Opaque \
          --from-literal=host="$(tr -d '\n' < /opt/host-info/host)" \
          --from-literal=username="$(tr -d '\n' < /opt/host-info/username)" \
          --from-file=id_rsa=/opt/host-info/id_rsa \
          --from-file=host-public-key=/opt/host-info/host-public-key \
          --dry-run=client -o json \
          | oc patch -f - --local --type=merge -o json -p "${OWNER_PATCH}" \
          | oc create -f -

        echo "[INFO] Successfully created secret: ${SECRET_NAME}"
        echo -n "${SECRET_NAME}" | tee "$(results.host-access-secret.path)"
