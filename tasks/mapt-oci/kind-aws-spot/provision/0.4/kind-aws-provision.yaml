---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kind-aws-provision
  labels:
    app.kubernetes.io/version: "0.4"
    upstream-usable: "true"
  annotations:
    tekton.dev/pipelines.minVersion: "0.44.x"
    tekton.dev/categories: infrastructure
    tekton.dev/tags: infrastructure, aws, kind
    tekton.dev/displayName: "Kind Cloud Single Node - Create"
    tekton.dev/platforms: "linux/amd64, linux/arm64"
    mapt/version: "0.14.5"
spec:
  description: |
    Creates a single-node Kubernetes cluster using Kind on AWS, powered by the Mapt CLI.
    This task is ideal for setting up ephemeral clusters for testing or CI/CD workflows.

    It supports:
      - Spot instance provisioning and nested virtualization
      - Custom CPU, memory, and architecture configurations
      - Automatic cluster cleanup via timeout
      - Securely exposes the generated kubeconfig as a Kubernetes Secret

  volumes:
    - name: aws-credentials
      secret:
        secretName: $(params.secret-aws-credentials)
    - name: cluster-info
      emptyDir: {}
    - name: logs
      emptyDir: {}
    - name: konflux-test-infra-volume
      secret:
        secretName: $(params.oci-credentials)

  params:
    - name: secret-aws-credentials
      type: string
      description: |
        K8S secret holding the aws credentials. Secret should be accessible to this task.

        ---
        apiVersion: v1
        kind: Secret
        metadata:
          name: aws-${name}
        type: Opaque
        data:
          access-key: ${access_key}
          secret-key: ${secret_key}
          region: ${region}
          bucket: ${bucket}
    - name: id
      type: string
      description: A unique identifier for this Kind environment
    - name: catalog-revision
      type: string
      default: "main"
      description: Git revision from which nested StepActions are resolved.
    - name: catalog-url
      type: string
      default: "https://github.com/konflux-ci/tekton-integration-catalog.git"
      description: Git repository URL from which nested StepActions are resolved.
    - name: cluster-access-secret-name
      type: string
      default: "$(context.pipelineRun.name)"
      description: |
        (Optional) The name to assign to the Kubernetes Secret that will store
        the kubeconfig for the created cluster. If not specified, a name will be auto-generated.
    - name: ssh-credentials-secret-name
      type: string
      default: ""
      description: |
        (Optional) The name to assign to the Kubernetes Secret that will store
        the SSH credentials (host, username, id_rsa) for the created VM.
        If left empty, no SSH credentials secret will be created.
    - name: ownerKind
      type: string
      default: "PipelineRun"
      description: |
        The type of Tekton resource (e.g., PipelineRun or TaskRun) that should own the kubeconfig Secret.
        Deleting this owner will also delete the Secret automatically.
    - name: ownerName
      type: string
      description: |
        The name of the PipelineRun or TaskRun that owns the resources.
    - name: ownerUid
      type: string
      description: |
        The UID of the PipelineRun or TaskRun that owns the resources. This ensures proper cleanup.
    - name: arch
      type: string
      default: "x86_64"
      description: |
        The architecture of the instance to launch. Choose between `x86_64` or `arm64`.
    - name: cpus
      type: string
      default: "16"
      description: |
        The number of vCPUs to allocate to the virtual machine.
    - name: memory
      type: string
      default: "64"
      description: |
        The amount of memory (in GiB) to allocate to the virtual machine.
    - name: compute-sizes
      type: string
      default: ""
      description: |
        Comma-separated list of compute sizes, e.g.: `m5a.large,m6a.large` (takes presendence over `arch`, `cpus` and `memory`)
    - name: nested-virt
      type: string
      default: "false"
      description: |
        Enables nested virtualization if set to `true`. Useful for running Kind inside a VM.
    - name: spot
      type: string
      default: "true"
      description: |
        Use spot instances to potentially reduce costs. Set to `true` to enable.
    - name: spot-increase-rate
      type: string
      default: "20"
      description: |
        Adds a percentage to the base spot price to improve chances of getting the instance.
    - name: spot-eviction-tolerance
      type: string
      default: "lowest"
      description: |
        if spot is enable we can define the minimum tolerance level of eviction.
        Allowed value are: lowest, low, medium, high or highest
    - name: version
      type: string
      default: "v1.32"
      description: |
        The desired Kubernetes version for the Kind cluster. If left blank, the latest stable version will be used.
    - name: tags
      type: string
      default: ""
      description: AWS resource tags. Tags iac=mapt and k8s-type=kind are added automatically.
    - name: debug
      type: string
      default: "false"
      description: |
        Enables verbose logging and prints sensitive data like credentials.
        Only use this for debugging in secure environments.
    - name: timeout
      type: string
      default: ""
      description: Auto-destroy timeout
    - name: oci-ref
      type: string
      description: Full OCI artifact reference in a format "quay.io/org/repo:tag. It's used for storing logs from the Task's Steps
    - name: oci-credentials
      type: string
      default: "konflux-test-infra"
      description: |
        The secret name containing credentials for container registry where the artifacts will be stored.
        The secret should contain `data.oci-storage-dockerconfigjson: <dockerconfigjson-content>`
    - name: extra-port-mappings
      type: string
      default: ""
      description: |
        Additional port mappings for the Kind cluster. Value should be a JSON array of objects with containerPort, hostPort, and protocol properties.
        Example: '[{\"containerPort\":30012,\"hostPort\":8180,\"protocol\":\"TCP\"}, {\"containerPort\":30013,\"hostPort\":8280,\"protocol\":\"TCP\"}]'

    - name: harden-control-plane
      type: string
      default: "false"
      description: |
        Enable control-plane hardening for the Kind cluster.
        When set to `true`, the provisioned cluster's scheduler, controller-manager,
        apiserver and etcd are patched with increased resource limits and tuned flags
        suitable for burst E2E workloads.

        Defaults are sized for 32 vCPUs / 64 GiB. Override the resource-tuning
        parameters for smaller profiles such as 24 vCPUs / 48 GiB.
    - name: apiserver-cpu
      type: string
      default: "2000m"
      description: CPU quantity applied to existing kube-apiserver resource fields; missing request or limit fields are not created.
    - name: apiserver-memory
      type: string
      default: "4Gi"
      description: Memory quantity applied to existing kube-apiserver resource fields; if no memory field exists, one is added, but missing request or limit fields are not guaranteed to be created.
    - name: apiserver-max-inflight
      type: string
      default: "800"
      description: Maximum non-mutating requests the API server handles at once.
    - name: apiserver-max-mutating-inflight
      type: string
      default: "400"
      description: Maximum mutating requests the API server handles at once.
    - name: controller-manager-cpu
      type: string
      default: "2000m"
      description: CPU quantity applied to existing kube-controller-manager resource fields; missing request or limit fields are not created.
    - name: controller-manager-memory
      type: string
      default: "4Gi"
      description: Memory quantity applied to existing kube-controller-manager resource fields; if no memory field exists, one is added, but missing request or limit fields are not guaranteed to be created.
    - name: scheduler-cpu
      type: string
      default: "2000m"
      description: CPU quantity applied to existing kube-scheduler resource fields; missing request or limit fields are not created.
    - name: scheduler-memory
      type: string
      default: "4Gi"
      description: Memory quantity applied to existing kube-scheduler resource fields; if no memory field exists, one is added, but missing request or limit fields are not guaranteed to be created.
    - name: etcd-cpu
      type: string
      default: "3000m"
      description: CPU quantity applied to existing etcd resource fields; missing request or limit fields are not created.
    - name: etcd-memory
      type: string
      default: "8Gi"
      description: Memory quantity applied to existing etcd resource fields; if no memory field exists, one is added, but missing request or limit fields are not guaranteed to be created.
    - name: containerd-memory-min
      type: string
      default: "8G"
      description: systemd MemoryMin reservation for containerd.
    - name: containerd-gomaxprocs
      type: string
      default: "8"
      description: GOMAXPROCS value for the containerd service.
    - name: containerd-gomemlimit
      type: string
      default: "12GiB"
      description: GOMEMLIMIT value for the containerd service.
    - name: containerd-max-concurrent-downloads
      type: string
      default: "50"
      description: Maximum concurrent image downloads handled by containerd.
    - name: max-pods
      type: string
      default: "350"
      description: Maximum number of pods the kubelet will allow on the node.
    - name: max-parallel-image-pulls
      type: string
      default: "15"
      description: Maximum number of image pulls the kubelet will perform in parallel.
    - name: coredns-replicas
      type: string
      default: "3"
      description: Number of CoreDNS replicas to run in kube-system.

  results:
    - name: cluster-access-secret
      description: Secret with kubeconfig
      value: $(steps.create-kubeconfig-secret.results.secret-name)
    - name: ssh-credentials-secret
      description: Secret with SSH credentials (host, username, id_rsa). Empty if not requested.
      value: $(steps.create-ssh-credentials-secret.results.secret-name)

  stepTemplate:
    env:
      - name: LOG_FILENAME
        value: '/var/log-dir/kind-aws-provision.log'
    volumeMounts:
      - name: logs
        mountPath: /var/log-dir

  steps:
    - name: create-kubeconfig-secret
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/create-kubeconfig-secret/0.1/create-kubeconfig-secret.yaml
      params:
        - name: secret-name
          value: $(params.cluster-access-secret-name)
        - name: namespace
          value: $(context.taskRun.namespace)
        - name: ownerKind
          value: $(params.ownerKind)
        - name: ownerName
          value: $(params.ownerName)
        - name: ownerUid
          value: $(params.ownerUid)

    - name: create-ssh-credentials-secret
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/create-ssh-credentials-secret/0.1/create-ssh-credentials-secret.yaml
      params:
        - name: secret-name
          value: $(params.ssh-credentials-secret-name)
        - name: namespace
          value: $(context.taskRun.namespace)
        - name: ownerKind
          value: $(params.ownerKind)
        - name: ownerName
          value: $(params.ownerName)
        - name: ownerUid
          value: $(params.ownerUid)

    - name: provisioner
      onError: continue
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/kind-aws-provisioner/0.1/kind-aws-provisioner.yaml
      params:
        - name: aws-credentials-volume
          value: aws-credentials
        - name: cluster-info-volume
          value: cluster-info
        - name: id
          value: $(params.id)
        - name: arch
          value: $(params.arch)
        - name: cpus
          value: $(params.cpus)
        - name: memory
          value: $(params.memory)
        - name: compute-sizes
          value: $(params.compute-sizes)
        - name: nested-virt
          value: $(params.nested-virt)
        - name: spot
          value: $(params.spot)
        - name: spot-increase-rate
          value: $(params.spot-increase-rate)
        - name: spot-eviction-tolerance
          value: $(params.spot-eviction-tolerance)
        - name: version
          value: $(params.version)
        - name: tags
          value: $(params.tags)
        - name: debug
          value: $(params.debug)
        - name: timeout
          value: $(params.timeout)
        - name: extra-port-mappings
          value: $(params.extra-port-mappings)

    - name: protect-control-plane
      onError: continue
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/protect-control-plane/0.2/protect-control-plane.yaml
      params:
        - name: harden-control-plane
          value: $(params.harden-control-plane)
        - name: kubeconfig-dir
          value: /opt/cluster-info
        - name: kubeconfig-volume-name
          value: cluster-info
        - name: apiserver-cpu
          value: $(params.apiserver-cpu)
        - name: apiserver-memory
          value: $(params.apiserver-memory)
        - name: apiserver-max-inflight
          value: $(params.apiserver-max-inflight)
        - name: apiserver-max-mutating-inflight
          value: $(params.apiserver-max-mutating-inflight)
        - name: controller-manager-cpu
          value: $(params.controller-manager-cpu)
        - name: controller-manager-memory
          value: $(params.controller-manager-memory)
        - name: scheduler-cpu
          value: $(params.scheduler-cpu)
        - name: scheduler-memory
          value: $(params.scheduler-memory)
        - name: etcd-cpu
          value: $(params.etcd-cpu)
        - name: etcd-memory
          value: $(params.etcd-memory)
        - name: containerd-memory-min
          value: $(params.containerd-memory-min)
        - name: containerd-gomaxprocs
          value: $(params.containerd-gomaxprocs)
        - name: containerd-gomemlimit
          value: $(params.containerd-gomemlimit)
        - name: containerd-max-concurrent-downloads
          value: $(params.containerd-max-concurrent-downloads)
        - name: max-pods
          value: $(params.max-pods)
        - name: max-parallel-image-pulls
          value: $(params.max-parallel-image-pulls)
        - name: coredns-replicas
          value: $(params.coredns-replicas)

    - name: update-kubeconfig-secret
      onError: continue
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/update-kubeconfig-secret/0.1/update-kubeconfig-secret.yaml
      params:
        - name: secret-name
          value: $(params.cluster-access-secret-name)
        - name: namespace
          value: $(context.taskRun.namespace)
        - name: cluster-info-volume
          value: cluster-info

    - name: update-ssh-credentials-secret
      onError: continue
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/update-ssh-credentials-secret/0.1/update-ssh-credentials-secret.yaml
      params:
        - name: secret-name
          value: $(params.ssh-credentials-secret-name)
        - name: namespace
          value: $(context.taskRun.namespace)
        - name: cluster-info-volume
          value: cluster-info

    - name: secure-push-oci
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/secure-push-oci/0.1/secure-push-oci.yaml
      params:
        - name: workdir-path
          value: /var/log-dir
        - name: oci-ref
          value: $(params.oci-ref)
        - name: credentials-volume-name
          value: konflux-test-infra-volume

    - name: fail-if-any-step-failed
      ref:
        resolver: git
        params:
          - name: url
            value: $(params.catalog-url)
          - name: revision
            value: $(params.catalog-revision)
          - name: pathInRepo
            value: stepactions/fail-if-any-step-failed/0.1/fail-if-any-step-failed.yaml
