---
apiVersion: tekton.dev/v1alpha1
kind: StepAction
metadata:
  name: kind-ibm-destroy
  labels:
    app.kubernetes.io/version: "0.1"
    upstream-usable: "true"
  annotations:
    tekton.dev/pipelines.minVersion: "0.44.x"
    tekton.dev/categories: infrastructure
    tekton.dev/tags: infrastructure, ibm, kind
    tekton.dev/displayName: "Kind on IBM Cloud - Destroy"
    tekton.dev/platforms: "linux/amd64, linux/arm64"
    mapt/version: "0.14.5"
spec:
  description: Destroys a Kind cluster on IBM Cloud using the same mapt state backend used for provisioning.
  image: quay.io/redhat-developer/mapt:v0.14.5
  params:
    - name: ibm-credentials-volume
      type: string
      description: Name of the volume that mounts the IBM Cloud credentials secret.
    - name: id
      type: string
      description: Unique identifier of the Kind environment to destroy.
    - name: region
      type: string
      default: us-south
      description: IBM Cloud region used by the cluster.
    - name: backed-url
      type: string
      description: Shared s3:// IBM COS backend used to locate mapt state.
    - name: debug
      type: string
      default: "false"
      description: Enables verbose logging.
    - name: force-destroy
      type: string
      default: "true"
      description: Destroy even if there is a provisioning lock on the stack.
  env:
    - name: IC_REGION
      value: $(params.region)
    - name: PARAM_ID
      value: $(params.id)
    - name: PARAM_REGION
      value: $(params.region)
    - name: PARAM_BACKED_URL
      value: $(params.backed-url)
    - name: PARAM_DEBUG
      value: $(params.debug)
    - name: PARAM_FORCE_DESTROY
      value: $(params.force-destroy)
  volumeMounts:
    - name: $(params.ibm-credentials-volume)
      mountPath: /opt/ibm-credentials
  script: |
    #!/usr/bin/env bash
    set -o errexit -o nounset -o pipefail
    IBMCLOUD_API_KEY="$(cat /opt/ibm-credentials/IBMCLOUD_API_KEY)"
    export IBMCLOUD_API_KEY
    IBMCLOUD_COS_ACCESS_KEY_ID="$(cat /opt/ibm-credentials/IBMCLOUD_COS_ACCESS_KEY_ID)"
    export IBMCLOUD_COS_ACCESS_KEY_ID
    IBMCLOUD_COS_SECRET_ACCESS_KEY="$(cat /opt/ibm-credentials/IBMCLOUD_COS_SECRET_ACCESS_KEY)"
    export IBMCLOUD_COS_SECRET_ACCESS_KEY
    if [[ -s /opt/ibm-credentials/IBMCLOUD_COS_ENDPOINT ]]; then
      IBMCLOUD_COS_ENDPOINT="$(cat /opt/ibm-credentials/IBMCLOUD_COS_ENDPOINT)"
      export IBMCLOUD_COS_ENDPOINT
    fi
    [[ "${PARAM_DEBUG}" == "true" ]] && set -x
    cmd=(mapt ibmcloud kind destroy \
      --project-name "kind-${PARAM_ID}" \
      --backed-url "${PARAM_BACKED_URL}")
    [[ "${PARAM_FORCE_DESTROY}" == "true" ]] && cmd+=(--force-destroy)
    "${cmd[@]}"
